personal:
  name: Louis Chouane
  title: Étudiant ingénieur en sciences numériques à l'ENSEEIHT
  bio: |
    Passionné par l'informatique depuis plusieurs années, je suis actuellement étudiant en dernière année à l'ENSEEIHT (spécialité Génie Logiciel). Je suis particulièrement stimulé par la R&D, la résolution de problèmes complexes et la conception d'architectures applicatives robustes.
    Je suis à la recherche d'un stage de fin d'études (PFE) de 6 mois à Toulouse à partir de mi-mars 2026.

    Ce portfolio offre un aperçu détaillé de mes projets, de mes expériences d'ingénierie et de mon parcours académique.

    N'hésitez pas à me contacter par email : chouane.louis@gmail.com.
  picture: /moi.png

projects:
  - title: Jeu de Catan en ligne
    description: Conception et développement d'une plateforme de jeu en ligne temps réel. Implémentation de la logique métier, gestion des sessions, synchronisation d'état via WebSockets, système d'authentification et persistance des données.
    techStack:
      - Java
      - Spring Boot
      - React
      - WebSocket
  - title: Compilateur Java
    description: Développement d’un compilateur traduisant un sous-ensemble du langage Java en instructions pour un CPU virtuel à pile. Analyse syntaxique/lexicale avec ANTLR, construction et vérification statique de l'AST, et génération du code machine cible.
    techStack:
      - Java
      - ANTLR
  - title: Agents mobiles distribués
    description: Conception d’agents logiciels autonomes capables de migrer dynamiquement entre des nœuds réseau via Java RMI et un Classloader personalisé. Permet d'étendre des API distantes sans modifier le backend et de déporter les traitements lourds (comme l'agrégation de données) pour réduire la bande passante.
    techStack:
      - Java
      - RMI
      - Multithreading
      - Custom Classloader
  - title: Jeu de casse-briques en programmation fonctionnelle
    description: Implémentation d'un moteur de jeu d'arcade selon le paradigme fonctionnel pur. Exploration avancée des concepts de récursion, d'immutabilité, de structures de données persistantes et de gestion d'état sans effets de bord.
    techStack:
      - OCaml
      - Programmation fonctionnelle
      - Monades
      - Foncteurs
      - Effets algébriques
  - title: Simulation de colonie de fourmis en temps réel
    description: Développement d'une application de simulation multi-agents interactive. Modélisation du comportement émergent d'une colonie (recherche de nourriture, obstacles) avec interface graphique Java Swing. Projet réalisé en équipe de 8 personnes en méthodologie Agile (Scrum).
    techStack:
      - Java
      - Swing
      - JUnit 4
      - Agile

